name: Validate Jekyll build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Install notebook dependencies
        run: pip3 install --upgrade jupyter
      - name: Build with project plugins
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --lsi
